# TeamTasks — 依存定義（ここに書かれたもの以外を増やさない）
# 完成形リポジトリ（`step-0-done`）で動作確認済みのもの（2026-09-04）。
# 同梱の uv.lock は実測環境の固定値（Python 3.13 / fastapi 0.141）。
[project]
name = "teamtasks"
version = "0.1.0"
description = "チームタスク管理 Web アプリ（ハーネス演習の生成対象）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
